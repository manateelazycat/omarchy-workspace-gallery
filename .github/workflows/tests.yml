name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  menu-index:
    runs-on: ubuntu-24.04
    container:
      image: node:20.19.5-bookworm@sha256:ba36e9b2705008e63e354214f0e3011c528af9df2ca13ac2bd2c0114650302e6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.5
      # MenuIndex.js is plain JS with no dependencies, so there is nothing to
      # install. The fixtures live in tests/, so Omarchy is not needed either.
      - run: node --test
