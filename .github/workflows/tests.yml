name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  menu-index:
    runs-on: ubuntu-24.04
    container:
      image: node:20.19.5-bookworm@sha256:ba36e9b2705008e63e354214f0e3011c528af9df2ca13ac2bd2c0114650302e6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.5
      - name: Install Python and Lua for installer tests
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 lua5.4
      # Tests use Python 3 for the installer and Lua for the generated bindings.
      # Desktop commands are mocked, so Omarchy is not needed.
      - run: node --test
